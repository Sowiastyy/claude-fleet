[package]
name = "claude-fleet"
version = "0.2.0"
edition = "2024"
rust-version = "1.85"
description = "A terminal multiplexer for Claude Code sessions on Windows"
license = "MIT"
repository = "https://github.com/Sowiastyy/claude-fleet"
readme = "README.md"
keywords = ["claude", "tui", "terminal", "multiplexer", "conpty"]
categories = ["command-line-utilities"]

[dependencies]
anyhow = "1.0.104"
crossterm = "0.29.0"
dirs = "7.0.0"
portable-pty = "0.9.0"
ratatui = "0.30.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.151"
toml = "0.9"
tui-term = "0.3.4"
vt100 = "0.16.2"
