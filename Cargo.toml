[workspace]
resolver = "3"
members = ["crates/core", "crates/cli", "crates/gui"]
# A plain `cargo build`/`test`/`clippy` covers the terminal app and the core it
# shares; the GUI needs its web frontend built first (see crates/gui).
default-members = ["crates/cli", "crates/core"]

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/Sowiastyy/claude-fleet"

[workspace.dependencies]
anyhow = "1.0.104"
dirs = "7.0.0"
portable-pty = "0.9.0"
serde = { version = "1.0", features = ["derive"] }
# `preserve_order`: `~/.claude.json` is written back when an account is
# switched, and it should come back in the order Claude Code wrote it.
serde_json = { version = "1.0.151", features = ["preserve_order"] }
libc = "0.2"
fleet-core = { path = "crates/core" }
