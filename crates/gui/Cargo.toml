[package]
name = "fleet-gui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
description = "Claude Fleet as a desktop app: chat and terminal over the same Claude Code sessions"

[[bin]]
name = "claude-fleet-gui"
path = "src/main.rs"

[features]
# Serve the page built into the binary (dist/) rather than the dev server at
# `devUrl`. `tauri build` turns this on by itself; a plain `cargo build` of a
# binary meant to run on its own (a release) has to ask for it.
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
fleet-core.workspace = true
anyhow.workspace = true
base64 = "0.22"
dirs.workspace = true
portable-pty.workspace = true
serde.workspace = true
serde_json.workspace = true
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
uuid = { version = "1", features = ["v4"] }
