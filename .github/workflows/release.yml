name: Release

# Every push to main that changes the program is released on its own.
#
# The version is the next patch after the newest `v*` tag. To move the minor
# or major number, set `version` in Cargo.toml above the newest tag and that
# is used instead. The number is written into Cargo.toml only for the build,
# so the binary knows what it is; nothing is committed back.
on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "LICENSE", ".gitignore", ".gitattributes", ".github/workflows/ci.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    outputs:
      new: ${{ steps.version.outputs.new }}
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Pick the version
        id: version
        shell: bash
        run: |
          if [ -n "$(git tag --points-at HEAD 'v*')" ]; then
            echo "this commit is already released"
            echo "new=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          declared=$(grep -m1 '^version' Cargo.toml | sed -E 's/.*"(.*)".*/\1/')
          latest=$(git tag -l 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n1 | sed 's/^v//')
          if [ -z "$latest" ]; then
            version="$declared"
          else
            IFS=. read -r ma mi pa <<< "$latest"
            bumped="$ma.$mi.$((pa + 1))"
            # Whichever is higher: the next patch, or what Cargo.toml asks for.
            version=$(printf '%s\n%s\n' "$bumped" "$declared" | sort -V | tail -n1)
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          echo "new=true" >> "$GITHUB_OUTPUT"
          echo "releasing v$version"

      - name: Stamp the version into the build
        if: steps.version.outputs.new == 'true'
        shell: bash
        run: |
          v="${{ steps.version.outputs.version }}"
          sed -i -E "0,/^version = \".*\"/s//version = \"$v\"/" Cargo.toml
          # Every crate that takes the workspace version, or --locked fails.
          for name in claude-fleet fleet-gui; do
            perl -0pi -e "s/(name = \"$name\"\nversion = )\"[^\"]*\"/\${1}\"$v\"/" Cargo.lock
          done
          grep -m1 '^version' Cargo.toml

      - uses: dtolnay/rust-toolchain@stable
        if: steps.version.outputs.new == 'true'

      - if: steps.version.outputs.new == 'true'
        run: cargo test --locked

      - if: steps.version.outputs.new == 'true'
        run: cargo build --release --locked

      - name: Publish release
        if: steps.version.outputs.new == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.version.outputs.tag }}" \
            target/release/claude-fleet.exe \
            --target "${{ github.sha }}" \
            --title "${{ steps.version.outputs.tag }}" \
            --generate-notes

  macos:
    needs: release
    if: needs.release.outputs.new == 'true'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Stamp the version into the build
        run: |
          v="${{ needs.release.outputs.version }}"
          perl -0pi -e "s/^version = \"[^\"]*\"/version = \"$v\"/m" Cargo.toml
          for name in claude-fleet fleet-gui; do
            perl -0pi -e "s/(name = \"$name\"\nversion = )\"[^\"]*\"/\${1}\"$v\"/" Cargo.lock
          done
          grep -m1 '^version' Cargo.toml

      - uses: dtolnay/rust-toolchain@stable

      - run: cargo build --release --locked

      - name: Attach the macOS build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp target/release/claude-fleet claude-fleet-macos-arm64
          gh release upload "${{ needs.release.outputs.tag }}" claude-fleet-macos-arm64

  # The desktop app rides on the same release: `claude-fleet-gui.exe` next to
  # the terminal app. The GUI's updater looks for that asset by name, the way
  # the terminal app looks for its own.
  gui:
    needs: release
    if: needs.release.outputs.new == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Stamp the version into the build
        shell: bash
        run: |
          v="${{ needs.release.outputs.version }}"
          sed -i -E "0,/^version = \".*\"/s//version = \"$v\"/" Cargo.toml
          for name in claude-fleet fleet-gui; do
            perl -0pi -e "s/(name = \"$name\"\nversion = )\"[^\"]*\"/\${1}\"$v\"/" Cargo.lock
          done
          grep -m1 '^version' Cargo.toml

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: crates/gui/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      # The page is built into dist/, which the binary embeds at compile time.
      - name: Build the page
        working-directory: crates/gui
        run: |
          npm ci
          npm run build

      # custom-protocol: the page is served from inside the binary, not from
      # the dev server.
      - run: cargo build --release --locked -p fleet-gui --features custom-protocol

      - name: Attach the GUI build
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp target/release/claude-fleet-gui.exe claude-fleet-gui.exe
          gh release upload "${{ needs.release.outputs.tag }}" claude-fleet-gui.exe
